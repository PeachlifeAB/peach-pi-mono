version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      github-actions:
        patterns:
          - '*'

  # Root holds every shared devDependency; the packages carry only their own
  # runtime deps and peerDependencies. Grouped so a toolchain bump arrives as
  # one reviewable PR rather than one per tool.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 reshapes the ts.* exports ppie-recover's architecture test
      # imports.
      - dependency-name: typescript

  - package-ecosystem: npm
    directory: /packages/ppie-recover
    schedule:
      interval: weekly
    cooldown:
      default-days: 2

  - package-ecosystem: npm
    directory: /packages/ppie-trail
    schedule:
      interval: weekly
    cooldown:
      default-days: 2

  - package-ecosystem: npm
    directory: /packages/ppie-custom-provider
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
