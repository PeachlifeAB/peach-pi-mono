name: trail version compatibility check

on:
  schedule:
    - cron: "0 0 * * 2"
  workflow_dispatch:
    inputs:
      ref:
        description: "trail ref to test against (branch, tag, or commit)"
        default: main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  upstream:
    name: ppie-trail against trail ${{ inputs.ref || 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install trail from upstream
        id: install
        env:
          TRAIL_REF: ${{ inputs.ref || 'main' }}
          CXXFLAGS: -std=c++20
        run: |
          git init /tmp/trail
          cd /tmp/trail
          git remote add origin https://github.com/trailhq/Trail-Code.git
          git fetch --depth 1 origin "$TRAIL_REF"
          git checkout FETCH_HEAD
          npm install
          node scripts/pack-trail.mjs
          npm install --global ./build/trail

      - name: Report the trail under test
        run: |
          echo "commit: $(git -C /tmp/trail rev-parse HEAD)"
          echo "version: $(trail --version)"

      - name: Run the ppie-trail suite
        id: suite
        run: pnpm --filter @peachlife/ppie-trail test

      - name: Report failure
        if: failure()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
        run: |
          if [ "$INSTALL_OUTCOME" = "failure" ]; then
            echo "::error::trail did not install or build from upstream — its build, not our tests"
          else
            echo "::error::ppie-trail's own suite failed against upstream trail — our contract with it moved"
          fi
