minimumReleaseAge: 2880
# First-party upstream (the host these extensions extend) is tracked at latest
# on purpose: extensions must run against the current Pi release, not a stale
# pin. The 2-day maturity gate still applies to everything else.
minimumReleaseAgeExclude:
  - "@earendil-works/pi-*"
  - "@mariozechner/pi-*"

# Transitive-only pins for advisories with no direct dependency to bump:
# brace-expansion reaches us through minimatch, nanoid through postcss,
# fast-uri through ajv, source-map-js through postcss, vite through vitest.
overrides:
  brace-expansion: "^5.0.12"
  fast-uri: "^3.1.8"
  nanoid: "^3.3.18"
  qs: "^6.16.0"
  source-map-js: "^1.2.2"
  vite: "^8.1.6"

packages:
  - "packages/*"

# dependency-cruiser extracts TypeScript through the compiler API, which typescript@7
# no longer publishes. Scope the last compiler it supports to that package alone.
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: "6.0.3"

catalog:
  # Shared Core & Build Tools
  "@biomejs/biome": "2.6.2"
  "@types/node": "26.6.5"
  "typescript": "7.0.2"
  "vitest": "5.0.5"
  "@vitest/coverage-v8": "5.0.5"
  "knip": "6.42.1"
  "dependency-cruiser": "18.7.0"
  "c8": "12.0.0"
  "tsx": "4.23.15"
  "husky": "9.1.7"
  # Common Extension Peer & Runtime Deps

allowBuilds:
  '@google/genai': true
  esbuild: false
  protobufjs: false
