minimumReleaseAge: 2880
# First-party upstream (the host these extensions extend) is tracked at latest
# on purpose: extensions must run against the current Pi release, not a stale
# pin. All remaining releases retain the 2-day maturity gate.
minimumReleaseAgeExclude:
  - "@earendil-works/pi-*"
  - "@mariozechner/pi-*"
  - "@biomejs/biome@2.6.4"
  - "@biomejs/cli-linux-x64@2.6.4"
  - "@biomejs/cli-win32-x64@2.6.4"
  - "@biomejs/cli-darwin-x64@2.6.4"
  - "@biomejs/cli-android-x64@2.6.4"
  - "@biomejs/cli-linux-arm64@2.6.4"
  - "@biomejs/cli-win32-arm64@2.6.4"
  - "@biomejs/cli-darwin-arm64@2.6.4"
  - "@biomejs/cli-android-arm64@2.6.4"
  - "@biomejs/cli-linux-x64-musl@2.6.4"
  - "@biomejs/cli-linux-arm64-musl@2.6.4"
  - "knip@6.44.0"

# Transitive-only pins for advisories with no direct dependency to bump:
# brace-expansion reaches us through minimatch, nanoid through postcss,
# fast-uri through ajv, source-map-js through postcss, vite through vitest,
# undici through pi-coding-agent and openai (GHSA-xjj6-f33q-929c).
overrides:
  undici: "^8.12.2"
  brace-expansion: "^5.0.12"
  fast-uri: "^3.1.8"
  nanoid: "^3.3.18"
  qs: "^6.16.0"
  source-map-js: "^1.2.2"
  vite: "^8.1.6"

packages:
  - "packages/*"

# dependency-cruiser extracts TypeScript through the compiler API, which typescript@7
# no longer publishes. Scope the last compiler it supports to that package alone.
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: "6.0.3"

catalog:
  # Shared Core & Build Tools
  "@biomejs/biome": 2.6.4
  "@types/node": 26.6.6
  "typescript": "7.0.2"
  "vitest": "5.0.5"
  "@vitest/coverage-v8": "5.0.5"
  "knip": 6.44.0
  "dependency-cruiser": "18.7.0"
  "c8": "12.0.0"
  "tsx": "4.23.15"
  "husky": "9.1.7"
  # Common Extension Peer & Runtime Deps

allowBuilds:
  '@google/genai': true
  esbuild: false
  protobufjs: false
